<svg viewBox="0 0 1200 790" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" />
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee" />
    </marker>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap");
      text {
        font-family: "JetBrains Mono", "Noto Sans SC", "PingFang SC", sans-serif;
      }
      .panel-title { fill: #f8fafc; font-size: 18px; font-weight: 700; }
      .step { fill: #22d3ee; font-size: 13px; font-weight: 700; }
      .ui { fill: #e2e8f0; font-size: 12px; font-weight: 500; }
      .muted { fill: #94a3b8; font-size: 10px; }
      .note { fill: #fbbf24; font-size: 11px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="790" fill="#0f172a" />
  <rect width="1200" height="790" fill="url(#grid)" />

  <text x="40" y="48" fill="#f8fafc" font-size="22" font-weight="700">GitHub Discussions：创建“课程讨论”分类</text>
  <text x="40" y="74" fill="#94a3b8" font-size="11">推荐直接重命名默认 Announcements 分类，保留 Giscus 推荐的公告格式</text>

  <!-- Step 1 -->
  <rect x="40" y="110" width="1120" height="120" rx="8" fill="#0f172a" />
  <rect x="40" y="110" width="1120" height="120" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5" />
  <text x="64" y="140" class="step">01 进入 Discussions</text>
  <rect x="64" y="158" width="1072" height="48" rx="6" fill="#161b22" stroke="#334155" />
  <text x="88" y="188" class="ui">Code</text>
  <text x="160" y="188" class="ui">Issues</text>
  <text x="238" y="188" class="ui">Pull requests</text>
  <rect x="358" y="166" width="126" height="31" rx="5" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" />
  <text x="421" y="187" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Discussions</text>
  <text x="514" y="188" class="ui">Actions</text>
  <path d="M 421 217 L 421 244" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)" />

  <!-- Step 2 -->
  <rect x="40" y="260" width="540" height="250" rx="8" fill="#0f172a" />
  <rect x="40" y="260" width="540" height="250" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5" />
  <text x="64" y="292" class="step">02 打开分类管理</text>
  <rect x="64" y="312" width="492" height="174" rx="6" fill="#161b22" stroke="#334155" />
  <text x="84" y="343" class="panel-title">Categories</text>
  <rect x="502" y="324" width="32" height="32" rx="5" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" />
  <path d="M 511 347 L 514 338 L 524 328 L 530 334 L 520 344 Z" fill="none" stroke="#e2e8f0" stroke-width="1.7" />
  <text x="84" y="380" class="ui">📣  Announcements</text>
  <text x="84" y="410" class="ui">💬  General</text>
  <text x="84" y="440" class="ui">💡  Ideas</text>
  <text x="290" y="469" class="muted" text-anchor="middle">点击 Categories 右侧的铅笔按钮</text>

  <!-- Step 3 -->
  <rect x="620" y="260" width="540" height="250" rx="8" fill="#0f172a" />
  <rect x="620" y="260" width="540" height="250" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5" />
  <text x="644" y="292" class="step">03 编辑 Announcements</text>
  <rect x="644" y="312" width="492" height="174" rx="6" fill="#161b22" stroke="#334155" />
  <text x="664" y="343" class="panel-title">Discussion categories</text>
  <rect x="664" y="360" width="452" height="84" rx="6" fill="#0f172a" stroke="#475569" />
  <text x="684" y="389" class="ui">📣  Announcements</text>
  <text x="684" y="415" class="muted">Updates and news from the maintainers</text>
  <rect x="1062" y="376" width="34" height="34" rx="5" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" />
  <path d="M 1071 400 L 1074 391 L 1084 381 L 1090 387 L 1080 397 Z" fill="none" stroke="#e2e8f0" stroke-width="1.7" />
  <text x="890" y="469" class="muted" text-anchor="middle">点击 Announcements 行右侧的铅笔按钮</text>

  <!-- Step 4 -->
  <rect x="40" y="540" width="1120" height="194" rx="8" fill="#0f172a" />
  <rect x="40" y="540" width="1120" height="194" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5" />
  <text x="64" y="572" class="step">04 修改名称并保存</text>
  <text x="64" y="612" class="muted">Category name</text>
  <rect x="64" y="622" width="316" height="42" rx="5" fill="#161b22" stroke="#60a5fa" />
  <text x="82" y="648" class="ui">课程讨论</text>
  <text x="414" y="612" class="muted">Description</text>
  <rect x="414" y="622" width="430" height="42" rx="5" fill="#161b22" stroke="#475569" />
  <text x="432" y="648" class="ui">每节课程的提问与讨论</text>
  <text x="878" y="612" class="muted">Discussion format</text>
  <rect x="878" y="622" width="258" height="42" rx="5" fill="#161b22" stroke="#34d399" />
  <text x="896" y="648" class="ui">Announcement（保持不变）</text>
  <rect x="958" y="680" width="178" height="36" rx="6" fill="#238636" stroke="#34d399" />
  <text x="1047" y="703" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Save changes</text>

  <rect x="40" y="752" width="1120" height="24" rx="4" fill="rgba(136,19,55,0.4)" stroke="#fb7185" />
  <text x="600" y="769" fill="#fecdd3" font-size="10" font-weight="600" text-anchor="middle">看不到铅笔按钮：确认已登录 GitHub，并且当前账号拥有 Agent101 仓库管理员权限</text>
</svg>
